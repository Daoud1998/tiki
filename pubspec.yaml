name: tiki
description: "Tki marketplace"
publish_to: "none"

version: 0.1.10+4
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  pdf: ^3.10.8
  printing: ^5.12.0
  flutter:
    sdk: flutter

  crypto: ^3.0.3

  firebase_app_check: ^0.4.1+4

  firebase_messaging: ^16.0.0

  sms_autofill: ^2.4.0

  # Localization + formatting
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Routing + state
  go_router: ^17.0.1
  flutter_riverpod: ^3.0.0

  # Local storage (guest prefs)
  shared_preferences: ^2.3.2

  # Local SQL cache (fast search)
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  # Share + external actions
  share_plus: ^12.0.1
  url_launcher: ^6.3.0

  # Images
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1

  # SVG (lightweight illustrations)
  flutter_svg: ^2.0.10
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.0
  firebase_core: ^4.4.0
  cloud_functions: ^6.0.6

  google_sign_in: ^6.2.1

  sign_in_with_apple: ^6.0.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/branding/tiki_app_icon_1024.png

flutter_native_splash:
  color: "#FCF4EE"
  image: assets/images/branding/tiki_splash.png

  android_12:
    color: "#FCF4EE"
    image: assets/images/branding/tiki_splash.png
    icon_background_color: "#FCF4EE"

flutter:
  uses-material-design: true
  assets:
    - assets/images/banners/ar/banner_1.png
    - assets/images/banners/ar/banner_2.png
    - assets/images/banners/ar/banner_3.png
    - assets/images/banners/fr/banner_1.png
    - assets/images/banners/fr/banner_2.png
    - assets/images/banners/fr/banner_3.png
    - assets/images/banners/en/banner_1.png
    - assets/images/banners/en/banner_2.png
    - assets/images/banners/en/banner_3.png

    # Publish wizard hints (SVG)
    - assets/illustrations/publish/checklist.svg
    - assets/illustrations/publish/contact.svg
    - assets/illustrations/publish/location.svg
    - assets/illustrations/publish/photo.svg
    - assets/illustrations/publish/price.svg

  # Fonts (optional now). If you don't add font files, remove this section.
  # To use it properly:
  # 1) Create assets/fonts/
  # 2) Add the font files:
  #    - NotoSans-Regular.ttf
  #    - NotoSans-Bold.ttf
  #    - NotoSansArabic-Regular.ttf
  #    - NotoSansArabic-Bold.ttf
  # 3) Keep this section as-is.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
